<style>

.t{left:0;top:calc(var(--t)/-2);width:100%;height:var(--t);transform:rotateX(90deg);background:#dcdcd8}
.f{inset:0;transform:translateZ(calc(var(--t)/2));overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}

.f::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.4),transparent 38%);opacity:.55;pointer-events:none}

.wf{--p:0;position:relative;flex:1;height:40px;cursor:pointer}

.bars.fill{clip-path:inset(0 calc(100% - var(--p)*1%) 0 0)}.bars.fill i{background:var(--ink);opacity:1}

.pb{margin-bottom:14px}.pb.in{animation:in .6s cubic-bezier(.2,.7,.2,1)}.pb h1{padding-right:30px}

.x:focus-visible,.lnk:focus-visible,.btn:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.meta{margin:0 0 4px;letter-spacing:.06em}.genre,.tags{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--mute)}
.desc{margin:10px 0 0;font:italic 400 18px/1.35 "Instrument Serif",Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.desc.open{display:block}
.more{border:0;background:none;padding:4px 0;color:var(--mute);text-decoration:underline;cursor:pointer;letter-spacing:.1em;font-size:12px}

.ed{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:clamp(20px,4vw,56px);z-index:9;width:min(290px,calc(100vw - 40px));box-sizing:border-box;padding:16px;background:var(--bg);border:1px solid var(--ink);display:flex;flex-direction:column;gap:10px;font-size:13px}.ed[hidden]{display:none}
.ed label{display:flex;flex-direction:column;gap:3px;color:var(--mute)}.ed input{font:inherit;padding:7px 8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ed .row{display:flex;gap:8px}.ed button{flex:1;padding:9px;border:1px solid var(--ink);background:transparent;cursor:pointer}.ed p{margin:0;min-height:1.2em;color:var(--mute)}
@media (max-width:640px){
 .info{left:0;right:0;bottom:0;width:auto;box-sizing:border-box;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:56vh;overflow:auto;transform:translateY(100%)}
 body[data-open] .info{transform:none}h1{font-size:clamp(34px,11vw,52px)}.x{top:4px;right:8px}
 .stage{transition:transform .7s cubic-bezier(.2,.7,.2,1)}body[data-open] .stage{transform:translateY(-16vh)}}
.empty{position:fixed;left:50%;top:45%;transform:translateX(-50%);z-index:4;color:var(--mute)}

#adm[hidden]{display:none}#adm a{color:inherit}
.an{display:flex;flex-direction:column;gap:2px;padding:24px 14px;border-right:1px solid var(--a-ln);min-height:100vh;box-sizing:border-box;position:sticky;top:0;align-self:start}
.an b{font:italic 400 22px "Instrument Serif",Georgia,serif;margin-bottom:14px}.an a{padding:9px 10px;text-decoration:none;border-radius:6px}.an a:hover,.an a[aria-current]{background:var(--a-sf)}
#am{padding:28px clamp(16px,3vw,40px) 80px;max-width:1100px}#am h2{font:400 34px "Instrument Serif",Georgia,serif;margin:0 0 18px}#am h3{margin:26px 0 10px}
#adm button,#adm .ab,#adm .bt,#adm select,#adm input,#adm textarea{font:inherit;color:inherit}

#adm .ab,#adm button[type=submit]{background:var(--a-ink);color:var(--a-bg)}#adm .dg{background:#b3261e;border-color:#b3261e;color:#fff}
#adm input,#adm select,#adm textarea{padding:9px 10px;border:1px solid var(--a-ln);border-radius:6px;background:var(--a-sf);min-height:40px;box-sizing:border-box;width:100%}
#adm input[type=checkbox]{width:auto;min-height:0}#adm :focus-visible{outline:3px solid var(--a-ink);outline-offset:2px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}.st div{background:var(--a-sf);border:1px solid var(--a-ln);padding:14px;border-radius:8px}.st b{display:block;font:400 40px "Instrument Serif",Georgia,serif;line-height:1}.st span{color:var(--a-mu)}
.rc{list-style:none;padding:0;margin:0}.rc li,.em{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--a-ln)}.em{flex-direction:column;align-items:flex-start;border:0;padding:30px 0}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tb input[type=search]{flex:1;min-width:180px;width:auto}.tb select{width:auto}
.rw{display:grid;grid-template-columns:52px minmax(120px,2fr) 1fr 1fr 96px auto;gap:12px;align-items:center;padding:10px;background:var(--a-sf);border:1px solid var(--a-ln);border-radius:8px;margin-bottom:8px}
.rw img{width:52px;height:52px;object-fit:cover;border-radius:4px;background:var(--a-ln)}.rw small{display:block;color:var(--a-mu)}.rw .ac{display:flex;flex-wrap:wrap;gap:6px}.rw .ac a,.rw .ac button{padding:6px 10px;min-height:34px;border:1px solid var(--a-ln);border-radius:6px;text-decoration:none;font-size:13px}
.pill{font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--a-ln);text-transform:uppercase;letter-spacing:.06em;text-align:center}.pill.published{background:#1f7a3f;color:#fff;border-color:#1f7a3f}
.fw{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}#f fieldset{background:var(--a-sf);border:1px solid var(--a-ln);border-radius:8px;margin:0 0 14px;padding:14px 16px 16px;display:grid;gap:12px}

.g2,.g3{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.ch{display:flex;flex-wrap:wrap;gap:6px 14px}.ch label{display:flex;gap:6px;align-items:center}
.md{display:grid;grid-template-columns:1fr 1fr;gap:14px}#cp{width:140px;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;margin-bottom:8px}#cp[hidden]{display:none}.md .ac{display:flex;gap:6px;flex-wrap:wrap}
#wv{width:100%;height:72px;border:1px solid var(--a-ln);border-radius:6px;cursor:pointer}#er{color:#b3261e}#er ul{margin:4px 0 0;padding-left:18px}
.lv{position:sticky;top:20px;background:var(--a-sf);border:1px solid var(--a-ln);border-radius:8px;padding:12px;display:grid;gap:6px}.lv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--a-ln)}.lv img[hidden]{display:none}.lv b{font:400 28px "Instrument Serif",Georgia,serif}.lv .bu{justify-self:start;padding:8px 22px;border-radius:99px;background:var(--a-ink);color:var(--a-bg);letter-spacing:.1em;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--a-ink);color:var(--a-bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
#dlg{border:1px solid var(--a-ln);border-radius:10px;background:var(--a-sf);color:var(--a-ink);max-width:420px}#dlg form{display:grid;gap:12px}#dlg .ac{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:860px){#adm{grid-template-columns:1fr}.an{flex-direction:row;flex-wrap:wrap;min-height:0;position:static;border-right:0;border-bottom:1px solid var(--a-ln);padding:12px}.an b{width:100%;margin:0}.fw{grid-template-columns:1fr}.lv{position:static}
 .rw{grid-template-columns:52px 1fr auto}.rw>:nth-child(3),.rw>:nth-child(4){display:none}.rw .ac{grid-column:1/-1}.g3,.md{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>Beats<span>Colección vol. 1</span><a class="lnk" href="#/admin">Admin</a></header>
<div class="hint" id="hint">Click a CD to hear its preview</div>
<main class="stage" id="stage" aria-label="Colección de beats">
  <div class="scene" id="scene"></div>
</main>
<section class="info" id="info" aria-label="Selected beat">
  <button class="x" id="close" type="button" aria-label="Cerrar panel">&times;</button>
  <div class="pb" id="pb">
    <h1 id="title" aria-live="polite"></h1>
    <p class="meta" id="meta"></p><p class="genre" id="genre"></p><p class="tags" id="tags"></p>

  </div>
  <div class="player" id="player" data-state="idle" role="group" aria-label="Reproductor del preview">
    <button class="pp" id="pp" type="button" aria-label="Reproducir preview"><svg class="pl" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg><svg class="ps" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg></button>
    <div class="wf" id="wf" role="progressbar" aria-label="Progreso del preview" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><div class="bars" id="b0"></div><div class="bars fill" id="b1"></div><i class="ph"></i></div>

<script>
/* ===== DATOS: añade o edita beats aquí. Cada objeto genera un CD. =====
   cover: ruta de la imagen (si no existe, se genera un cover provisional).
   audio, previewStart, previewDuration, buyUrl: reservados para la etapa 2. */
const D={type:"beat",currency:"USD",license:"Basic Lease",previewDuration:30,status:"available",duration:"3:00",price:29.99,tags:[],description:""};
const beat=(n,title,o)=>{const id="beat-"+String(n).padStart(3,"0"),slug=title.toLowerCase().replace(/ /g,"-");
  return{...D,id,title,cover:"covers/"+id+".jpg",audio:n<=6?"audio/"+slug+".mp3":null,buyUrl:"https://payhip.com/b/DEMO"+n,...o}};
/* status: available | coming-soon | sold | hidden (hidden existe en los datos pero no sale en la galería) */
const SEED=[
  beat(1,"NIGHT SHIFT",{bpm:142,key:"C minor",genre:"Trap",mood:"Dark / Atmospheric",duration:"3:14",previewStart:42,tags:["dark","trap","cinematic"],description:"Dark atmospheric production with cinematic textures, distorted synths and heavy drums built for late-night drives and slow-motion hooks."}),
  beat(2,"AFTER HOURS",{bpm:128,key:"F minor",genre:"R&B",mood:"Late / Smooth",duration:"2:58",previewStart:71,price:24.99,tags:["rnb","smooth","night"],description:"Silky keys over a patient groove."}),
  beat(3,"VOID",{bpm:150,key:"D minor",genre:"Drill",mood:"Cold / Aggressive",duration:"2:41",previewStart:28,price:34.99,tags:["drill","cold","sliding"],description:"Sliding 808s and icy strings."}),
  beat(4,"NO SIGNAL",{bpm:140,key:"A minor",genre:"Trap",mood:"Eerie / Minimal",duration:"3:02",previewStart:94,tags:["eerie","minimal","trap"],description:"Sparse, tense and hypnotic."}),
  beat(5,"MIDNIGHT",{bpm:96,key:"G minor",genre:"Boom Bap",mood:"Dusty / Nostalgic",duration:"3:20",previewStart:60,price:19.99,tags:["boombap","dusty","sample"],description:"Dusty drums and a looped piano sample."}),

/* ===== Cover provisional generado (se usa si el archivo no existe) ===== */
function art(b,n){
  const c=document.createElement("canvas");c.width=c.height=360;const x=c.getContext("2d");
  const h=(n*47+200)%360,h2=(h+40+n*13)%360,k=n%4;
  const g=x.createLinearGradient(0,0,360,360);
  g.addColorStop(0,`hsl(${h} 70% ${k==3?16:55}%)`);g.addColorStop(1,`hsl(${h2} 75% ${k==3?40:30}%)`);
  x.fillStyle=g;x.fillRect(0,0,360,360);x.fillStyle=`hsl(${h2} 85% 70% / .85)`;
  if(k==0){x.beginPath();x.arc(180,200,95,0,7);x.fill()}
  if(k==1){for(let i=0;i<8;i++)x.fillRect(0,20+i*38,360,18-i*2)}
  if(k==2){x.beginPath();x.arc(80,60,150,0,7);x.fill();x.fillStyle=`hsl(${h} 60% 12%)`;x.fillRect(0,250,360,110)}
  if(k==3){x.strokeStyle=`hsl(${h2} 90% 65%)`;x.lineWidth=3;for(let i=1;i<7;i++){x.beginPath();x.arc(180,170,i*28,0,7);x.stroke()}}
  x.fillStyle="#fff";x.font="600 28px system-ui,sans-serif";x.fillText(b.title,20,334);
  x.font="13px system-ui,sans-serif";x.fillText(b.id,20,30);
  return c.toDataURL("image/jpeg",.85);
}

/* ===== AUDIO: un solo <audio> para toda la tienda, creado al primer uso (nada se carga al abrir la página) =====
   El motor es genérico: lee previewStart / previewDuration / audio del beat, nunca de un beat concreto. */
const DEMO=true; // true: si el archivo de audio no existe, se sintetiza un beat de prueba. Ponlo en false con audios reales.
const Engine=(()=>{
  let a,b=null,st="idle",start=0,dur=30,tok=0,fb=false,raf=0,vol=.8;const subs=[],cache=new Map();
  const emit=()=>subs.forEach(f=>f()),set=s=>{st=s;emit()},clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
  const seek=()=>{if(Math.abs(a.currentTime-start)>.25)a.currentTime=start};
  const go=()=>{const my=tok;a.play().catch(()=>{if(my===tok&&st!=="playing")set("paused")})};
  const loop=()=>{cancelAnimationFrame(raf);const f=()=>{
    if(st!=="playing")return;
    if(a.currentTime>=start+dur){set("ended");a.pause();return}   // fin del preview: se detiene
    emit();raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)};
  const make=()=>{a=new Audio();a.volume=vol;
    a.addEventListener("error",()=>{if(!b)return;if(DEMO&&!fb&&b.audio){fb=true;demo(b,tok)}else set("error")});
    a.addEventListener("loadedmetadata",()=>{if(st==="loading")seek()});
    a.addEventListener("canplay",()=>{if(st!=="loading")return;seek();set("ready");go()});
    a.addEventListener("playing",()=>{if(st==="ready"||st==="paused"){set("playing");loop()}});
    a.addEventListener("pause",()=>{if(st==="playing")set("paused")});
    a.addEventListener("ended",()=>{if(st==="playing")set("ended")})};
  async function demo(nb,my){const k=[nb.id,nb.bpm,nb.key,nb.previewStart].join();let u=cache.get(k);
    if(!u){u=await synth(nb,my);if(!u)return;cache.set(k,u)}
    if(my===tok){a.src=u;a.load()}}
  async function synth(nb,my){   // beat de prueba (WAV 8 kHz) generado según bpm y tonalidad del beat
    const R=8000,n=Math.ceil(((+nb.previewStart||0)+(+nb.previewDuration||30)+6)*R),buf=new Int16Array(n);
    const K={C:0,D:2,E:4,F:5,G:7,A:9,B:11},k=String(nb.key),r=(K[k[0]]||0)+(k[1]==="#"?1:k[1]==="b"?-1:0);
    const root=65.4*2**(r/12),th=/min/i.test(k)?3:4,sp=60/(nb.bpm||120)/4,T=6.2832,seq=[0,0,-2,3],kk=nb.bpm%3?[0,6,10]:[0,3,10,12],arp=[0,th,7,th];
    for(let i=0;i<n;i++){
      if(i%90000===0&&i){await new Promise(z=>setTimeout(z));if(my!==tok)return null}
      const t=i/R,q=t/sp,s=Math.floor(q)%16,u=(q%1)*sp,bar=Math.floor(q/16)%4;let v=0;
      if(kk.includes(s))v+=Math.sin(T*(45*u+3*(1-Math.exp(-30*u))))*Math.exp(-u*7)*.9;
      if(s===4||s===12)v+=(Math.random()*2-1)*Math.exp(-u*16)*.4;
      v+=(Math.random()*2-1)*Math.exp(-u*55)*.12*(s%2?.6:1);
      v+=Math.sin(T*root*2**(seq[bar]/12)*t)*.28*(.55+.45*Math.exp(-(q%4)*sp*3));
      if(s%2===0)v+=Math.sin(T*root*4*2**(arp[(s>>1)%4]/12)*t)*.07*Math.exp(-u*8);
      buf[i]=Math.max(-1,Math.min(1,v*.8))*32767}
    const h=new DataView(new ArrayBuffer(44)),w=(o,x)=>[...x].forEach((c,j)=>h.setUint8(o+j,c.charCodeAt(0)));
    w(0,"RIFF");h.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);
    h.setUint32(24,R,true);h.setUint32(28,R*2,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,"data");h.setUint32(40,n*2,true);
    const by=new Uint8Array(44+n*2);by.set(new Uint8Array(h.buffer));by.set(new Uint8Array(buf.buffer),44);
    let o="";for(let i=0;i<by.length;i+=32768)o+=String.fromCharCode.apply(null,by.subarray(i,i+32768));
    return "data:audio/wav;base64,"+btoa(o)}
  const live=["playing","paused","ready","ended"];
  return{
    get beat(){return b},get state(){return st},get dur(){return dur},sub:f=>subs.push(f),
    elapsed(){return st==="ended"?dur:(!a||!live.includes(st))?0:clamp(a.currentTime-start,0,dur)},
    load(nb){tok++;b=nb;start=+nb.previewStart||0;dur=+nb.previewDuration||30;fb=false;st="loading";
      if(!a)make();a.pause();
      if(!nb.audio){set("error");return}
      set("loading");a.preload="auto";const my=tok;mediaService.url(nb.audio).then(u=>{if(my===tok){a.src=u||nb.audio;a.load()}})},
    toggle(){if(st==="playing")a.pause();else if(st==="paused"||st==="ready")go();
      else if(st==="ended"){set("paused");a.currentTime=start;go()}else if(st==="error"&&b)this.load(b)},
    seek(fr){if(!live.includes(st))return;a.currentTime=start+clamp(fr,0,1)*dur;if(st==="ended")set("paused");else emit()},
    stop(){if(live.includes(st)){set("paused");a.pause();a.currentTime=start}},
    volume(v){vol=v;if(a)a.volume=v},
    release(){tok++;if(a)a.pause();b=null;st="idle";emit()}}
})();

/* ===== SERVICIOS: la UI nunca toca localStorage/IndexedDB directamente. Cambiar a API+DB = reescribir solo esto ===== */
const slugify=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const store=(()=>{const m={};return{read(k,d){if(k in m)return m[k];try{const v=JSON.parse(localStorage.getItem(k));if(v!=null)return m[k]=v}catch(e){}return d},write(k,v){m[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}})();
const settingsService={get:()=>({producer:"Producer Name",store:"Beats & Sound",currency:"USD",previewDuration:30,...store.read("shop:settings",{})}),set:v=>store.write("shop:settings",v)};
const mediaService=(()=>{   // local (IndexedDB); sustituible por Supabase Storage / Cloudinary / S3 con la misma interfaz
  const mem=new Map(),urls={};let dbp;
  const db=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open("shop-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const tx=async(mode,fn)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction("m",mode),q=fn(t.objectStore("m"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
  const put=async(f,kind)=>{const id="media:"+kind+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);mem.set(id,f);try{await tx("readwrite",x=>x.put(f,id))}catch(e){}return id};
  return{uploadImage:f=>put(f,"img"),uploadAudio:f=>put(f,"aud"),
    async deleteMedia(id){mem.delete(id);delete urls[id];try{await tx("readwrite",x=>x.delete(id))}catch(e){}},
    async url(ref){if(!ref||!String(ref).startsWith("media:"))return ref||null;if(urls[ref])return urls[ref];
      let f=mem.get(ref);if(!f){try{f=await tx("readonly",x=>x.get(ref))}catch(e){}}return f?(urls[ref]=URL.createObjectURL(f)):null}}})();
const productService=(()=>{
  const subs=[],t0=Date.parse("2026-01-01");let list=store.read("shop:products",null);
  const save=()=>{store.write("shop:products",list);subs.forEach(f=>f())},live=()=>list.filter(p=>!p.deletedAt),now=()=>new Date().toISOString();
  if(!list){   // migración inicial: los beats de demo pasan al modelo de producto (status: draft|published|hidden; availability: available|coming-soon|sold)
    list=SEED.map((b,i)=>({...b,type:"beat",slug:slugify(b.title),availability:b.status==="hidden"?"available":b.status,status:b.status==="hidden"?"hidden":"published",createdAt:new Date(t0+i*864e5).toISOString(),updatedAt:new Date(t0+i*864e5).toISOString(),deletedAt:null}));
    store.write("shop:products",list)}
  const api={sub:f=>subs.push(f),getProducts:live,getProduct:id=>live().find(p=>p.id===id)||null,
    published:()=>live().filter(p=>p.type==="beat"&&p.status==="published"),
    uniqueSlug(v,except){const b=slugify(v)||"beat";let n=b,i=2;while(list.some(p=>p.slug===n&&p.id!==except))n=b+"-"+i++;return n},
    createProduct(p){const n=1+Math.max(0,...list.map(x=>+String(x.id).split("-")[1]||0)),t=now(),r={type:"beat",availability:"available",status:"draft",...p,id:"beat-"+String(n).padStart(3,"0"),createdAt:t,updatedAt:t,deletedAt:null};list.push(r);save();return r},
    updateProduct(id,patch){const i=list.findIndex(p=>p.id===id);if(i<0)return null;list[i]={...list[i],...patch,id,updatedAt:now()};save();return list[i]},
    deleteProduct:id=>api.updateProduct(id,{deletedAt:now()}),   // soft delete
    publishProduct:id=>api.updateProduct(id,{status:"published"}),unpublishProduct:id=>api.updateProduct(id,{status:"draft"})};
  return api})();
const beats=productService.published();   // la tienda pública solo lee esto

/* ===== Escena ===== */
const $=s=>document.querySelector(s);
const stage=$("#stage"),scene=$("#scene"),N=beats.length;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const P=46,G=64,PULL=118;               // separación, hueco junto al seleccionado, salida lateral
let cur=Math.min(4,Math.max(0,N-1)),prev=cur,open=false,gp=0,pos=reduce?cur:cur+8,hov=-1,mx=0,my=0,sx=0,sy=0,last=0,raf=0;
const hv=new Float32Array(N);

const cds=beats.map((b,i)=>{
  const el=document.createElement("button");
  el.type="button";el.className="cd";el.dataset.state="idle";
  el.setAttribute("aria-label",`${b.title}, beat ${i+1} de ${N}`);
  el.innerHTML='<i class="b"></i><i class="r"></i><i class="t"></i><span class="f"><img alt="" draggable="false"><span class="sh"></span><span class="eq"><i></i><i></i><i></i></span></span>';
  const img=el.querySelector("img");
  img.onerror=()=>{img.onerror=null;img.src=art(b,i)};
  mediaService.url(b.cover).then(u=>img.src=u||"covers/none.jpg");
  el.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){hov=i;stage.classList.add("hov");wake()}});
  el.addEventListener("pointerleave",()=>{if(hov===i){hov=-1;stage.classList.remove("hov");wake()}});
  el.addEventListener("click",()=>{if(swiped){swiped=false;return}if(i===cur&&open)playPause();else select(i)});
  scene.appendChild(el);return el;
});

function scale(){return Math.max(.6,Math.min(1.35,Math.min(innerWidth/900,innerHeight/720)))}

function render(){
  scene.style.transform=`scale(${scale()}) rotateX(${-35-sy*3}deg) rotateY(${-24+sx*5}deg)`;
  for(let i=0;i<N;i++){
    const d=i-pos,a=Math.abs(d),s=Math.max(-1,Math.min(1,d));
    let k=Math.max(0,1-a);k=k*k*(3-2*k)*gp;
    const h=hv[i],z=-(d*P+G*gp*s);
    cds[i].style.transform=`translate3d(${PULL*k+16*h}px,${-6*h}px,${z+18*h+10*k}px) rotateY(${-6*k+3*h}deg) scale(${1+.05*k+.03*h})`;
  }
}

function tick(t){
  raf=0;const dt=Math.min(.05,(t-last)/1000||.016);last=t;
  const f=q=>reduce?1:1-Math.pow(1-q,dt*60);let busy=false;
  const np=pos+(cur-pos)*f(.075);
  if(Math.abs(cur-np)<.002)pos=cur;else{pos=np;busy=true}
  const gt=open?1:0;gp+=(gt-gp)*f(.075);if(Math.abs(gt-gp)<.002)gp=gt;else busy=true;
  sx+=(mx-sx)*f(.06);sy+=(my-sy)*f(.06);
  if(Math.abs(mx-sx)>.002||Math.abs(my-sy)>.002)busy=true;
  const moving=Math.abs(cur-pos)>.01||Math.abs(gp-(open?1:0))>.01;
  for(let i=0;i<N;i++){
    const tg=i===hov?1:0;hv[i]+=(tg-hv[i])*f(.18);
    if(Math.abs(tg-hv[i])>.003)busy=true;
    const st=moving&&(i===cur||i===prev)?"transitioning":i===cur&&open?"selected":i===hov?"hover":"idle";
    if(cds[i].dataset.state!==st){cds[i].dataset.state=st;cds[i].setAttribute("aria-pressed",i===cur&&open)}
  }
  render();
  if(busy)raf=requestAnimationFrame(tick);
}
function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}

/* ===== Panel del beat seleccionado (marcadores para la etapa 2) ===== */
const T=$("#title"),PB=$("#pb"),DESC=$("#desc"),MORE=$("#more"),BUY=$("#buy");
const fmtPrice=(p,c)=>{try{return new Intl.NumberFormat("en-US",{style:"currency",currency:c||"USD"}).format(p)}catch(e){return (c||"")+" "+p}};

const track=(n,d)=>dispatchEvent(new CustomEvent("shop:"+n,{detail:d}));   // gancho para analytics (etapa futura)
const lic=b=>(b.licenses&&b.licenses[0])||{name:b.license,price:b.price,buyUrl:b.buyUrl};   // listo para varias licencias

  else{BUY.removeAttribute("href");BUY.setAttribute("aria-disabled","true");BUY.removeAttribute("aria-label")}

function select(i){
  if(!N)return;

  prev=cur;cur=i;open=true;document.body.toggleAttribute("data-open",true);
  panel();hint();wake();Engine.load(beats[cur]);track("select",{id:beats[cur].id});

/* ===== Entradas: teclado, rueda, swipe, botones ===== */
addEventListener("keydown",e=>{
  if(!ADM.hidden)return;

  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key===" "&&!/^(BUTTON|A|SELECT)$/.test(e.target.tagName)){e.preventDefault();playPause();return}
  const m={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};
  if(e.key in m){e.preventDefault();select(cur+m[e.key])}
  else if(e.key==="Home"){select(0)}else if(e.key==="End"){select(N-1)}

let acc=0,wt=0;
stage.addEventListener("wheel",e=>{
  e.preventDefault();acc+=e.deltaY+e.deltaX;
  if(Math.abs(acc)>50&&performance.now()-wt>170){select(cur+(acc>0?1:-1));acc=0;wt=performance.now()}
},{passive:false});

/* ===== Reproductor visual: solo lee del motor, nunca crea audio ===== */
const $pl=$("#player"),$wf=$("#wf"),$tm=$("#time"),$st=$("#status"),$pp=$("#pp");
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const MSG={idle:"Press play to listen",loading:"LOADING PREVIEW…",ready:"Ready",playing:"Playing",paused:"Paused",ended:"Preview ended",error:"PREVIEW UNAVAILABLE"};
let lastTx="",lastSt="";

function ui(){
  const b=beats[cur],mine=open&&Engine.beat===b,s=mine?Engine.state:"idle";
  const d=mine?Engine.dur:(+b.previewDuration||30),e=mine?Engine.elapsed():0,tx=fmt(e)+" / "+fmt(d);
  if(tx!==lastTx){lastTx=tx;$tm.textContent=tx;$wf.setAttribute("aria-valuenow",Math.floor(e));$wf.setAttribute("aria-valuemax",d)}

function drawBars(b){   // waveform decorativa del preview (determinista por beat); se podrá reemplazar por la real
  let h=0;for(const c of b.id+b.previewStart)h=(h*31+c.charCodeAt(0))>>>0;let o="";
  for(let i=0;i<56;i++){h=(h*1664525+1013904223)>>>0;o+=`<i style="height:${Math.round(18+82*(h/4294967296)*(.45+.55*Math.abs(Math.sin(i/5+(h%5)))))}%"></i>`}
  $("#b0").innerHTML=$("#b1").innerHTML=o}

const ADM=$("#adm"),AM=$("#am"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const NOTES=["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"],GENRES=["Trap","Hip-Hop","R&B","Drill","Boom Bap","Pop","Soul","Afro","Electronic","Ambient","Hyperpop","Lo-fi","Experimental","Other"],MOODS=["Dark","Atmospheric","Aggressive","Melodic","Chill","Energetic","Cinematic","Emotional","Experimental"],CUR=["USD","EUR","GBP"],LIC=["Basic Lease","Premium Lease","Unlimited","Exclusive"];
const EMPTY='<div class="em"><b>NO BEATS YET</b><span>Create your first beat.</span><a class="ab" href="#/admin/beats/new">+ ADD BEAT</a></div>';
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)};
const dlg=$("#dlg");
const ask=(t,body,ok)=>new Promise(r=>{dlg.innerHTML=`<form method="dialog"><h3>${esc(t)}</h3><div>${body}</div><div class="ac"><button value="no">${ok?"Cancel":"Close"}</button>${ok?`<button value="yes" class="dg">${ok}</button>`:""}</div></form>`;dlg.returnValue="";dlg.onclose=()=>r(dlg.returnValue==="yes");dlg.showModal()});
const list_=a=>`<ul>${a.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`;
function problems(p,full,audioDur){
  const e=[];
  if(!String(p.title||"").trim())e.push("Title is required.");else if(p.title.length>80)e.push("Title is too long (80 characters max).");
  if(!p.slug)e.push("Slug is required.");
  if(p.bpm!==""&&p.bpm!=null&&!(p.bpm>0&&p.bpm<=400))e.push("BPM must be a number above 0.");
  if(p.buyUrl&&!safeUrl(p.buyUrl))e.push("Payhip URL is invalid (use a full https:// link).");
  if(!(p.previewStart>=0))e.push("Preview start cannot be negative.");
  if(!(p.previewDuration>0))e.push("Preview duration must be greater than 0.");
  if(audioDur&&p.previewStart+p.previewDuration>audioDur+.01)e.push("Preview exceeds audio duration.");
  if(full){if(!p.cover)e.push("Cover image is required.");if(!p.audio)e.push("Audio file is required.");if(!p.bpm)e.push("BPM is required.");if(!p.key)e.push("Key is required.");
    if(!(p.price>0))e.push("Price is required.");if(!p.currency)e.push("Currency is required.");if(!p.buyUrl)e.push("Payhip URL is missing.")}
  return e}
let dirty=false,aud=null;productService.sub(()=>dirty=true);
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/"),isA=parts[0]==="admin";
  ADM.hidden=!isA;
  if(isA){closePanel();Engine.release();if(aud)aud.pause();
    ADM.querySelectorAll(".an a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")===location.hash||(a.getAttribute("href")==="#/admin/beats"&&/beats\/.+edit/.test(location.hash))));
    const v=parts[1]||"";AM.innerHTML="";
    if(v==="beats"&&parts[2]==="new")form(null);else if(v==="beats"&&parts[3]==="edit")form(parts[2]);else if(v==="beats")list();else if(v==="settings")settings();else dash()}
  else if(dirty)location.reload()}
addEventListener("hashchange",route);
function dash(){
  const L=productService.getProducts(),c=s=>L.filter(p=>p.status===s).length;
  AM.innerHTML=`<h2>Producer dashboard</h2><div class="st">${[["Beats",L.length],["Published",c("published")],["Drafts",c("draft")],["Hidden",c("hidden")]].map(([a,b])=>`<div><b>${b}</b><span>${a}</span></div>`).join("")}</div><a class="ab" href="#/admin/beats/new">+ ADD NEW BEAT</a><h3>Recent beats</h3>${L.length?`<ul class="rc">${[...L].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,5).map(p=>`<li><a href="#/admin/beats/${p.id}/edit">${esc(p.title)}</a><i class="pill ${p.status}">${p.status}</i></li>`).join("")}</ul>`:EMPTY}`}
const Q={q:"",st:"all",sort:"new"},SORTS={new:["Newest",(a,b)=>b.createdAt.localeCompare(a.createdAt)],old:["Oldest",(a,b)=>a.createdAt.localeCompare(b.createdAt)],az:["Title A-Z",(a,b)=>a.title.localeCompare(b.title)],za:["Title Z-A",(a,b)=>b.title.localeCompare(a.title)],lo:["Price low-high",(a,b)=>a.price-b.price],hi:["Price high-low",(a,b)=>b.price-a.price],bpm:["BPM",(a,b)=>a.bpm-b.bpm]};
function list(){
  AM.innerHTML=`<h2>Beats</h2><div class="tb"><input id="q" type="search" placeholder="Search title, ID, genre, key, BPM…" aria-label="Search beats" value="${esc(Q.q)}"><select id="fs" aria-label="Filter by status">${["all","published","draft","hidden"].map(s=>`<option${s===Q.st?" selected":""}>${s}</option>`).join("")}</select><select id="so" aria-label="Sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}"${k===Q.sort?" selected":""}>${v[0]}</option>`).join("")}</select><a class="ab" href="#/admin/beats/new">+ ADD BEAT</a></div><div id="rows"></div>`;
  $("#q").oninput=e=>{Q.q=e.target.value;rows()};$("#fs").onchange=e=>{Q.st=e.target.value;rows()};$("#so").onchange=e=>{Q.sort=e.target.value;rows()};rows()}
const row=p=>`<article class="rw" data-id="${p.id}"><img alt="" data-cv="${esc(p.cover||"")}"><div><b>${esc(p.title)}</b><small>${p.id} · ${up(p.type)}</small></div><span>${p.bpm||"–"} BPM · ${esc(p.key||"–")}</span><span>${p.price!=null&&p.price!==""?fmtPrice(p.price,p.currency):"–"}</span><i class="pill ${p.status}">${p.status}</i><div class="ac"><a href="#/admin/beats/${p.id}/edit">Edit</a><button data-a="dup">Duplicate</button><button data-a="${p.status==="published"?"unpub":"pub"}">${p.status==="published"?"Unpublish":"Publish"}</button><button data-a="del">Delete</button></div></article>`;
function rows(){
  const t=Q.q.trim().toLowerCase(),all=productService.getProducts();
  const L=all.filter(p=>(Q.st==="all"||p.status===Q.st)&&(!t||[p.title,p.id,p.genre,p.key,p.bpm].join(" ").toLowerCase().includes(t))).sort(SORTS[Q.sort][1]);
  $("#rows").innerHTML=L.length?L.map(row).join(""):all.length?'<p class="em">No beats match your search.</p>':EMPTY;
  AM.querySelectorAll("img[data-cv]").forEach(async i=>{const id=i.closest("[data-id]").dataset.id;i.onerror=()=>{i.onerror=null;i.src=art({title:"",id},parseInt(id.slice(5)))};i.src=(await mediaService.url(i.dataset.cv))||"covers/none.jpg"})}
AM.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"),row=b&&b.closest("[data-id]"),p=row&&productService.getProduct(row.dataset.id);if(!p)return;const a=b.dataset.a;
  if(a==="dup"){const n=productService.createProduct({...p,title:p.title+" COPY",slug:productService.uniqueSlug(p.slug+"-copy"),status:"draft"});toast("Duplicated");location.hash="#/admin/beats/"+n.id+"/edit"}
  else if(a==="unpub"){productService.unpublishProduct(p.id);toast("Unpublished");rows()}
  else if(a==="pub"){const er=problems(p,true);if(er.length)await ask("Cannot publish",list_(er));else{productService.publishProduct(p.id);toast("Published");rows()}}
  else if(a==="del"&&await ask(`Delete "${p.title}"?`,"This action cannot be undone.","Delete")){productService.deleteProduct(p.id);toast("Deleted");rows()}});
function settings(){
  const S=settingsService.get();
  AM.innerHTML=`<h2>Store settings</h2><form id="sf" class="fw" style="display:grid;max-width:420px;gap:12px">${[["producer","Producer name","text"],["store","Store name","text"],["previewDuration","Default preview duration (s)","number"]].map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t}" value="${esc(S[k])}"></label>`).join("")}<label>Default currency<select name="currency">${CUR.map(c=>`<option${c===S.currency?" selected":""}>${c}</option>`).join("")}</select></label><button type="submit">Save</button></form>`;
  $("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);settingsService.set({producer:f.get("producer"),store:f.get("store"),currency:f.get("currency"),previewDuration:+f.get("previewDuration")||30});toast("Saved")}}
function form(id){
  let old=id?productService.getProduct(id):null;
  if(id&&!old){AM.innerHTML='<h2>Beat not found</h2><a href="#/admin/beats">Back to beats</a>';return}
  const S=settingsService.get(),F=old?{...old}:{title:"",slug:"",description:"",cover:null,audio:null,bpm:"",key:"",genre:"Trap",mood:"",previewStart:0,previewDuration:S.previewDuration,price:"",currency:S.currency,license:"Basic Lease",buyUrl:"",status:"draft",availability:"available"};
  let cf=null,af=null,slugEdited=!!old,peaks=null,dur=null,cUrl=null,aUrl=null;
  const [note,mode]=(F.key||" ").split(" "),moods=new Set((F.mood||"").split(" / ").filter(Boolean));
  const sel=(n,o,v)=>`<select name="${n}">${o.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`,fl=(l,h)=>`<label>${l}${h}</label>`,inp=(n,t,v,x="")=>`<input name="${n}" type="${t}" value="${esc(v)}" ${x}>`;
  AM.innerHTML=`<h2>${old?"Edit beat":"New beat"}</h2><div class="fw"><form id="f" novalidate>
<fieldset><legend>General</legend>${fl("Title",inp("title","text",F.title,'maxlength="80"'))}${fl("Slug",inp("slug","text",F.slug))}${fl("Description",`<textarea name="desc" rows="4">${esc(F.description)}</textarea>`)}</fieldset>
<fieldset><legend>Media</legend><div class="md"><div><img id="cp" alt="Cover preview" hidden><div class="ac"><label class="bt">Upload cover<input type="file" name="cf" accept="image/jpeg,image/png,image/webp" hidden></label><button type="button" id="cx">Remove</button></div></div><div><p id="ai">No audio uploaded</p><label class="bt">Upload audio<input type="file" name="af" accept=".mp3,.wav,audio/mpeg,audio/wav" hidden></label></div></div></fieldset>
<fieldset><legend>Music</legend><div class="g3">${fl("BPM",inp("bpm","number",F.bpm,'min="1" step="any"'))}${fl("Key",`<span class="g2">${sel("note",["",...NOTES],note||"")}${sel("mode",["minor","major"],mode||"minor")}</span>`)}${fl("Genre",sel("genre",[...new Set([...GENRES,F.genre].filter(Boolean))],F.genre))}</div><div class="ch">${[...new Set([...MOODS,...moods])].map(m=>`<label><input type="checkbox" name="mood" value="${esc(m)}"${moods.has(m)?" checked":""}> ${esc(m)}</label>`).join("")}</div></fieldset>
<fieldset><legend>Preview</legend><canvas id="wv" width="600" height="72" role="img" aria-label="Waveform. Click to set where the preview starts."></canvas><div class="g3">${fl("Start (s)",inp("ps","number",F.previewStart,'min="0" step="any"'))}${fl("Duration (s)",inp("pd","number",F.previewDuration,'min="1" step="any"'))}${fl("End",'<output id="pe"></output>')}</div><div><button type="button" id="pp2">Play preview</button></div></fieldset>
<fieldset><legend>Commerce</legend><div class="g3">${fl("Price",inp("price","number",F.price,'min="0" step="any"'))}${fl("Currency",sel("cur",CUR,F.currency))}${fl("License",sel("lic",[...new Set([...LIC,F.license].filter(Boolean))],F.license))}</div>${fl("Payhip product URL",inp("buy","url",F.buyUrl||"",'placeholder="https://payhip.com/b/…"'))}</fieldset>
<fieldset><legend>Publish</legend>${fl("Status",sel("status",["draft","published","hidden"],F.status))}<div id="er" role="alert"></div><div class="ac" style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit">${old?"Save changes":"Save draft"}</button><button type="button" id="pb2">Publish</button><a class="bt" href="#/admin/beats">Cancel</a></div></fieldset></form><aside class="lv" id="lv" aria-label="Live preview"></aside></div>`;
  const g=n=>AM.querySelector(`[name=${n}]`),showErr=(e,full)=>{$("#er").innerHTML=`<b>${full?"Cannot publish:":"Please fix:"}</b>${list_(e)}`};
  const read=()=>Object.assign(F,{title:g("title").value.trim(),slug:slugify(g("slug").value),description:g("desc").value.trim(),bpm:g("bpm").value===""?"":+g("bpm").value,key:g("note").value?g("note").value+" "+g("mode").value:"",genre:g("genre").value,mood:[...AM.querySelectorAll("[name=mood]:checked")].map(x=>x.value).join(" / "),previewStart:+g("ps").value,previewDuration:+g("pd").value,price:g("price").value===""?"":+g("price").value,currency:g("cur").value,license:g("lic").value,buyUrl:g("buy").value.trim(),status:g("status").value});
  const showCover=()=>{const i=$("#cp");i.hidden=!cUrl;i.onerror=()=>{i.hidden=true};if(cUrl)i.src=cUrl;upd()};
  function draw(){const c=$("#wv"),x=c.getContext("2d"),w=c.width,h=c.height,col=getComputedStyle(AM).color;x.clearRect(0,0,w,h);x.fillStyle=col;
    if(!peaks){x.globalAlpha=.5;x.font="13px system-ui";x.fillText("Upload audio to see the waveform",10,40);x.globalAlpha=1;return}
    const a=F.previewStart/dur*w,b=(F.previewStart+F.previewDuration)/dur*w,bw=w/peaks.length;x.globalAlpha=.14;x.fillRect(a,0,b-a,h);
    peaks.forEach((p,i)=>{x.globalAlpha=i*bw>=a&&i*bw<=b?1:.35;x.fillRect(i*bw,h/2-p*h/2,bw-1,Math.max(1,p*h))});x.globalAlpha=1}
  function upd(){read();$("#pe").textContent=fmt(F.previewStart+F.previewDuration);draw();
    $("#lv").innerHTML=`<img alt="" ${cUrl?`src="${esc(cUrl)}"`:"hidden"}><b>${esc(F.title||"Untitled")}</b><span>${F.bpm?F.bpm+" BPM · ":""}${esc(up(F.key))}</span><span>${F.price!==""?fmtPrice(F.price,F.currency):""} ${esc(up(F.license))}</span><span class="bu">BUY</span>`}
  async function loadAudio(url,label){
    try{const buf=await (await fetch(url)).arrayBuffer(),ctx=new (window.AudioContext||window.webkitAudioContext)(),d=await ctx.decodeAudioData(buf);ctx.close();dur=d.duration;
      const ch=d.getChannelData(0),n=150,st=Math.floor(ch.length/n);peaks=Array.from({length:n},(_,i)=>{let m=0;for(let j=i*st;j<(i+1)*st;j+=Math.max(1,st>>6))m=Math.max(m,Math.abs(ch[j]));return m});
      aUrl=url;$("#ai").textContent=`${label} · ${fmt(dur)}${af?` · ${(af.size/1048576).toFixed(1)} MB`:""}`}
    catch(e){peaks=null;dur=null;$("#ai").textContent=`${label} · waveform unavailable`}upd()}
  g("cf").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)){showErr(["Cover must be a JPG, PNG or WEBP image."]);return}cf=f;cUrl=URL.createObjectURL(f);showCover()};
  $("#cx").onclick=()=>{cf=null;F.cover=null;cUrl=null;showCover()};
  g("af").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/\.(mp3|wav)$/i.test(f.name)&&!/audio\/(mpeg|mp3|wav|x-wav)/.test(f.type)){showErr(["Audio must be an MP3 or WAV file."]);return}af=f;aUrl=null;loadAudio(URL.createObjectURL(f),f.name)};
  $("#wv").onclick=e=>{if(!dur)return;const r=e.target.getBoundingClientRect();g("ps").value=Math.max(0,Math.min(dur-F.previewDuration,Math.round((e.clientX-r.left)/r.width*dur))).toFixed(0);upd()};
  $("#pp2").onclick=async()=>{read();const u=aUrl||await mediaService.url(F.audio);if(!u){toast("Upload audio first");return}
    aud=aud||new Audio();aud.pause();aud.src=u;aud.onloadedmetadata=()=>{aud.currentTime=F.previewStart;aud.play()};aud.ontimeupdate=()=>{if(aud.currentTime>=F.previewStart+F.previewDuration)aud.pause()};aud.onerror=()=>toast("This audio file could not be played.")};
  g("title").addEventListener("input",()=>{if(!slugEdited)g("slug").value=productService.uniqueSlug(g("title").value,old&&old.id)});
  g("slug").addEventListener("input",()=>slugEdited=true);AM.querySelector("#f").addEventListener("input",upd);
  async function save(force){
    read();if(force)F.status=force;const full=F.status==="published",er=problems({...F,cover:F.cover||(cf&&1),audio:F.audio||(af&&1)},full,dur);
    if(er.length){showErr(er,full);return}
    F.slug=productService.uniqueSlug(F.slug||F.title,old&&old.id);
    if(cf){F.cover=await mediaService.uploadImage(cf);cf=null}if(af){F.audio=await mediaService.uploadAudio(af);af=null}
    const {id:_i,createdAt:_c,updatedAt:_u,...data}=F,r=old?productService.updateProduct(old.id,data):productService.createProduct(data);
    toast(full&&(!old||old.status!=="published")?"Published":"Saved");
    if(old)form(r.id);else location.hash="#/admin/beats/"+r.id+"/edit"}
  AM.querySelector("#f").onsubmit=e=>{e.preventDefault();save(null)};$("#pb2").onclick=()=>save("published");
  mediaService.url(F.cover).then(u=>{if(u&&!cf){cUrl=u;showCover()}});
  if(F.audio)mediaService.url(F.audio).then(u=>u?loadAudio(u,String(F.audio).startsWith("media:")?"Uploaded audio":F.audio):upd());
  upd()}
MORE.onclick=()=>{const o=DESC.classList.toggle("open");MORE.textContent=o?"LESS":"MORE";MORE.setAttribute("aria-expanded",String(o))};
$("#close").onclick=closePanel;
BUY.addEventListener("click",()=>{if(BUY.hasAttribute("href"))track("buy_click",{id:beats[cur].id})});
stage.addEventListener("click",e=>{if(open&&!swiped&&(e.target===stage||e.target===scene))closePanel()});
Engine.sub(ui);$pp.onclick=playPause;
$wf.addEventListener("click",e=>{const r=$wf.getBoundingClientRect();Engine.seek((e.clientX-r.left)/r.width)});
$("#vol").oninput=e=>Engine.volume(e.target.value/100);
addEventListener("resize",wake);

if(N)panel();else{const m=document.createElement("p");m.className="empty";m.innerHTML='No beats published yet. <a href="#/admin">Open admin</a>';document.body.appendChild(m)}
wake();route();
</script>
